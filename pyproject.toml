[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finpipe"
version = "0.1.0"
description = "Financial transaction data pipeline: S3, Lambda, Glue, Step Functions, Athena (with a local mode for development)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0,<3",
    "pyarrow>=15",
    "numpy>=1.24,<2.5",
    "boto3>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "moto[s3,sns,sqs,athena,ssm]>=5",
    "duckdb>=1.0",
    "ruff>=0.5",
]

[project.scripts]
finpipe = "finpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lambdas", "glue", "scripts"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP006", "UP007"]
ignore = ["E501", "B008"]
